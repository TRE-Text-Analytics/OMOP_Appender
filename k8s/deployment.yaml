apiVersion: apps/v1
kind: Deployment
metadata:
  name: omop-appender
  labels:
    app.kubernetes.io/name: omop-appender
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: omop-appender
  template:
    metadata:
      labels:
        app.kubernetes.io/name: omop-appender
    spec:
      # Replaces docker-compose's `extra_hosts: host.docker.internal:host-gateway`.
      # Kubernetes has no "host-gateway"; point this at the IP of the machine
      # running your database (or delete it and use a Service DNS name instead).
      hostAliases:
        - ip: "192.168.1.100"            # <-- CHANGE ME
          hostnames:
            - "host.docker.internal"
      containers:
        - name: omop-appender
          image: ghcr.io/your-org/omop-appender:latest   # <-- CHANGE ME
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
          # Probes use a TCP check because the app's health endpoint is unknown.
          # Swap to httpGet (e.g. path: /docs or /health) if you have one.
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 30       # allows up to 150s for first start
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
      # Equivalent of compose's `restart: unless-stopped`
      restartPolicy: Always
